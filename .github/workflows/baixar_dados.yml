name: Baixar dados do workshop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/baixar_dados.yml"

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar os datasets das fontes originais
        run: |
          set -e
          T=/tmp/fontes; mkdir -p "$T"
          baixar() { curl -fsSL --retry 3 -o "$T/$1" "$2"; }
          baixar adult.csv    "https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data"
          baixar german.csv   "https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data"
          baixar compas.csv   "https://raw.githubusercontent.com/propublica/compas-analysis/master/compas-scores-two-years.csv"
          baixar diabetes.csv "https://raw.githubusercontent.com/fairlearn/talks/main/2021_scipy_tutorial/data/diabetic_preprocessed.csv"
          baixar law.csv      "https://raw.githubusercontent.com/tailequy/fairness_dataset/main/experiments/data/law_school_clean.csv"
          baixar student.csv  "https://raw.githubusercontent.com/arunk13/MSDA-Assignments/master/IS607Fall2015/Assignment3/student-por.csv"
          for f in "$T"/*.csv; do [ -s "$f" ] || { echo "ERRO: $f veio vazio"; exit 1; }; done

          # versão estendida: 6 casos
          mkdir -p workshop_estendido/recursos/dados
          for c in adult compas german diabetes law student; do cp "$T/$c.csv" workshop_estendido/recursos/dados/; done
          # versão reduzida: 5 casos (sem diabetes)
          mkdir -p workshop_reduzido/recursos/dados
          for c in adult compas german law student; do cp "$T/$c.csv" workshop_reduzido/recursos/dados/; done
          ls -la workshop_*/recursos/dados/

      - name: Remover arquivos da estrutura antiga (o conteúdo agora está em workshop_estendido/)
        run: |
          if [ -f workshop_estendido/workshop_ia_responsavel_estendido.ipynb ]; then
            git rm -r --quiet --ignore-unmatch dados workshop_ia_responsavel.ipynb GUIA_DO_INSTRUTOR.md material_instrutor.csv
          else
            echo "Estrutura nova ainda não enviada — nada removido."
          fi

      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workshop_estendido/recursos/dados workshop_reduzido/recursos/dados
          git diff --cached --quiet && echo "Nada a atualizar" || git commit -m "Atualiza datasets do workshop (download automático das fontes originais)"
          git push
